# Install only after the existing shared Nginx configuration passes nginx -t.
server {
    listen 80;
    server_name admin.rezina.yaltopia.com;
    location ^~ /.well-known/acme-challenge/ { root /srv/rezina/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name admin.rezina.yaltopia.com;
    ssl_certificate /srv/rezina/tls/live/rezina/fullchain.pem;
    ssl_certificate_key /srv/rezina/tls/live/rezina/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/rezina-admin.access.log;
    error_log /var/log/nginx/rezina-admin.error.log;
    root /srv/rezina/current/admin;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
