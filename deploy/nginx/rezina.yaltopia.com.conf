# Install only after the existing shared Nginx configuration passes nginx -t.
server {
    listen 80;
    server_name rezina.yaltopia.com;
    location ^~ /.well-known/acme-challenge/ { root /srv/rezina/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name rezina.yaltopia.com;
    ssl_certificate /srv/rezina/tls/live/rezina/fullchain.pem;
    ssl_certificate_key /srv/rezina/tls/live/rezina/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/rezina-customer.access.log;
    error_log /var/log/nginx/rezina-customer.error.log;
    location / {
        proxy_pass http://127.0.0.1:18182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
